services:

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot
    restart: unless-stopped


  nodered:
    image: nodered/node-red
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
    networks:
      - iot
    restart: unless-stopped


  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    ports:
      - "8181:8181"
    volumes:
      - ./influxdb3/data:/var/lib/influxdb3/data
      - ./influxdb3/plugins:/var/lib/influxdb3/plugins
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --without-auth
    networks:
      - iot
    restart: unless-stopped


  influxdb-explorer:
    image: influxdata/influxdb3-ui:latest
    container_name: influxdb-explorer
    ports:
      - "8888:8080"
    volumes:
      - ./influxdb3-ui/db:/db:rw
      - ./influxdb3-ui/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=student123
    command:
      - "--mode=admin"
    depends_on:
      - influxdb
    networks:
      - iot
    restart: unless-stopped


  # Beveiligde Docker API toegang voor Portainer
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-socket-proxy

    environment:
      # Leesrechten
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      VERSION: 1
      EVENTS: 1

      # Geen wijzigingen uitvoeren
      POST: 0
      DELETE: 0
      BUILD: 0
      EXEC: 0
      AUTH: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    expose:
      - "2375"

    networks:
      - iot

    restart: unless-stopped


  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - ./portainer:/data
    command: -H tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy
    networks:
      - iot
    restart: unless-stopped


  stock-generator:
    build: ./stock-generator
    container_name: stock-generator
    depends_on:
      - mosquitto
    networks:
      - iot
    restart: unless-stopped


  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./dashboard/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - iot
    restart: unless-stopped


  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma:/app/data
    networks:
      - iot
    restart: unless-stopped


networks:
  iot:
    driver: bridge