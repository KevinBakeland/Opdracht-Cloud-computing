services:
  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot
    restart: unless-stopped

  nodered:
    image: nodered/node-red
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - mosquitto
    networks:
      - iot
    restart: unless-stopped

  influxdb:
    image: influxdb:3-core
    container_name: influxdb
    ports:
      - "8181:8181"
    volumes:
      - ./influxdb3/data:/var/lib/influxdb3/data
      - ./influxdb3/plugins:/var/lib/influxdb3/plugins
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --without-auth
    networks:
      - iot
    restart: unless-stopped

  influxdb-explorer:
    image: influxdata/influxdb3-ui:latest
    container_name: influxdb-explorer
    ports:
      - "8888:8080"
    volumes:
      - ./influxdb3-ui/db:/db:rw
      - ./influxdb3-ui/config:/app-root/config:ro
    environment:
      - SESSION_SECRET_KEY=student123
    command:
      - "--mode=admin"
    depends_on:
      - influxdb
    networks:
      - iot
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer:/data
    networks:
      - iot
    restart: unless-stopped

  stock-generator:
    build: ./stock-generator
    container_name: stock-generator
    depends_on:
      - mosquitto
    networks:
      - iot
    restart: unless-stopped

  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./dashboard/public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - iot
    restart: unless-stopped

networks:
  iot:
    driver: bridge